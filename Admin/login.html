
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrativo | JACK'S</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #181615;
            color: #F8F6F4;
            font-family: Arial, sans-serif;
        }

        .login-contenedor {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #23201E;
            border: 1px solid #3B3532;
            border-radius: 14px;
        }

        .etiqueta {
            color: #D4A359;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #D1CAC4;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #181615;
            border: 1px solid #3B3532;
            border-radius: 7px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #D4A359;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #D4A359;
            color: #1A140E;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 15px;
            color: #F0B5B5;
            font-size: 14px;
            line-height: 1.4;
        }

        .volver {
            display: block;
            margin-top: 22px;
            color: #D4A359;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="login-contenedor">

        <p class="etiqueta">PIZZERÍA JACK'S</p>

        <h1>Administración</h1>

        <p class="descripcion">
            Ingresa con tu cuenta autorizada para administrar
            la información de la pizzería.
        </p>

        <form id="formularioLogin">

            <div class="campo">
                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="botonLogin">
                Iniciar sesión
            </button>

            <p id="mensaje" role="status"></p>

        </form>

        <a href="/" class="volver">
            Volver a la página principal
        </a>

    </main>

    <script>
        const formulario = document.getElementById("formularioLogin");
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("botonLogin");

        formulario.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            boton.disabled = true;
            boton.textContent = "Verificando...";
            mensaje.textContent = "";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const respuesta = await fetch("/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        resultado.error || "No se pudo iniciar sesión."
                    );
                }

                window.location.replace("/admin/");

            } catch(error) {

                mensaje.textContent = error.message;

            } finally {

                boton.disabled = false;
                boton.textContent = "Iniciar sesión";

            }

        });
    </script>

</body>
</html>
