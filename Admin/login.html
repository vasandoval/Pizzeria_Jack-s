
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso administrativo | JACK'S</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-contenedor">

        <p class="etiqueta">PIZZERÍA JACK'S</p>

        <h1>Administración</h1>

        <p class="descripcion">
            Ingresa con tu cuenta autorizada para administrar
            la información de la pizzería.
        </p>

        <form id="formularioLogin">

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="botonLogin">
                Iniciar sesión
            </button>

            <p id="mensaje" role="status"></p>

        </form>

        <a href="/" class="volver">
            Volver a la página principal
        </a>

    </main>

    <script src="login.js"></script>

</body>
</html>
